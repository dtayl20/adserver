<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>adserver — management console</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="/admin/styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <strong>adserver</strong>
    <span class="tag" id="env-tag">console</span>
  </div>
  <nav class="tabs" id="tabs"></nav>
  <div class="who" id="who"></div>
</header>

<main id="main">
  <p class="muted">Loading…</p>
</main>

<div class="modal-backdrop" id="modal-backdrop" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <h2 id="modal-title">Title</h2>
    <form id="modal-form"></form>
    <div class="modal-actions">
      <button type="button" class="btn ghost" id="modal-cancel">Cancel</button>
      <button type="submit" class="btn primary" id="modal-save" form="modal-form">Save</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="/admin/app.js"></script>
</body>
</html>
